[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mupo-sales-team"
version = "0.2.0"
description = "Multi-agent sales team for MUPO Entertainment (MUPO TV)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MUPO Entertainment" }]
license = { text = "MIT" }
keywords = ["multi-agent", "crewai", "sales", "xai", "grok", "crm"]
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "rich>=13.9.0",
  "typer>=0.12.5",
  "tabulate>=0.9.0",
  "tenacity>=9.0.0",
  "python-dateutil>=2.9.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
# Live multi-agent runs (CrewAI + xAI). Prefer Python 3.11–3.13.
llm = [
  "crewai>=0.86.0",
  "crewai-tools>=0.17.0",
  "openai>=1.55.0",
  "litellm>=1.52.0",
]
ui = ["streamlit>=1.32.0"]
gmail = [
  "google-api-python-client>=2.120.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
]
vector = ["chromadb>=0.5.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
all = [
  "mupo-sales-team[llm,ui,gmail,vector,dev]",
]

[project.urls]
Homepage = "https://github.com/Mr-n-MrsDePot/mupo-sales-team"
Repository = "https://github.com/Mr-n-MrsDePot/mupo-sales-team"
Issues = "https://github.com/Mr-n-MrsDePot/mupo-sales-team/issues"

[project.scripts]
mupo-sales = "mupo_sales.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
