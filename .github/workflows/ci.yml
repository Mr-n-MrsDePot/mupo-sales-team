name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Offline demo smoke
        run: python -m mupo_sales.main demo

      - name: Install LLM extras (CrewAI)
        run: pip install -e ".[llm]"

      - name: Import LLM stack
        run: python -c "from mupo_sales.crew.sales_crew import build_sales_crew; print('crew import ok')"
